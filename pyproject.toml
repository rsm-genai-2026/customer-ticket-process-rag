[project]
name = "milestone02"
version = "0.1.0"
description = "Milestone 02 student starter — GenAI for Business"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "ipykernel>=6.29",
    "ipython>=8.0",
    "requests>=2.32",
    "pyarrow>=17",
    "mcp>=1.27.1",
    "connectorx>=0.4",
    "markdown>=3.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that make real network calls to the TritonAI API (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
